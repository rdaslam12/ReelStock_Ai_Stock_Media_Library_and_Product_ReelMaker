{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReelStock Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body class="admin-login-body">
  <main class="admin-login-card">
    <div class="admin-login-mark">RS</div>
    <h1>Admin Login</h1>
    <p>Sign in with a staff or superuser account.</p>

    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label">Email or username</label>
        <input class="form-control" name="identifier" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Log In to Admin</button>
    </form>

    <div class="d-flex justify-content-between align-items-center mt-4 small">
      <a href="{% url 'home' %}" class="text-muted text-decoration-none">Public site</a>
      <a href="{% url 'admin:index' %}" class="text-muted text-decoration-none">Django admin backup</a>
    </div>
  </main>
</body>
</html>
