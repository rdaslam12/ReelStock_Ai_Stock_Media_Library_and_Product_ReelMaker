{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReelStock Admin Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin_login.css' %}" />
</head>

<body class="admin-body d-flex align-items-center justify-content-center">

  <div class="card p-4 shadow-sm" style="width: 360px;">
    <div class="text-center mb-4">
      <div class="fw-bold fs-4">ReelStock</div>
      <div class="text-muted small">Admin Access</div>
    </div>

    <form>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" placeholder="admin">
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="••••••••">
      </div>

      <a href="{% url 'admin_dashboard' %}" class="btn btn-light w-100">
        Login
      </a>
    </form>

    <div class="text-center mt-3">
      <a href="/" class="text-muted small">Back to Website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
