{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <h2 class="h4 mb-3 text-center">Register</h2>
      <form>
        <div class="mb-3">
          <label for="id_username" class="form-label">Username</label>
          <input type="text" class="form-control" id="id_username" placeholder="Choose a username" />
        </div>
        <div class="mb-3">
          <label for="id_email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="id_email" placeholder="Enter email" />
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Password</label>
          <input type="password" class="form-control" id="id_password" placeholder="Create a password" />
        </div>
        <div class="mb-3">
          <label for="id_confirm_password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="id_confirm_password" placeholder="Confirm password" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="mt-3 text-center">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
      </p>
    </div>
  </div>
{% endblock %}
