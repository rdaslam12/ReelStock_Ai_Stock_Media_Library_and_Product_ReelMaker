{% extends 'base.html' %}
{% block title %}Password Updated - ReelStock{% endblock %}
{% block content %}
<div class="auth-page-wrap">
  <div class="auth-card reveal-up text-center">
    <div class="auth-logo"><span class="text-primary fw-bold">Reel</span>Stock</div>
    <h2 class="auth-heading">Password updated</h2>
    <p class="auth-sub">Your password has been changed. You can now log in with the new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Log In</a>
  </div>
</div>
{% endblock %}
