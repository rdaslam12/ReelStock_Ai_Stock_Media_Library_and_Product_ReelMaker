{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <h2 class="h4 mb-3 text-center">Login</h2>
      <form>
        <div class="mb-3">
          <label for="id_username" class="form-label">Username or Email</label>
          <input type="text" class="form-control" id="id_username" placeholder="Enter username or email" />
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Password</label>
          <input type="password" class="form-control" id="id_password" placeholder="Enter password" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 text-center">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
      </p>
    </div>
  </div>
{% endblock %}
